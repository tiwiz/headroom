name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (tests, detekt, ktfmt, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Logs memory, swap and disk every 30 seconds next to the build, so a runner that dies
      # mid-job still leaves a record of what it was short of. See issue #6.
      - name: Run check
        run: |
          scripts/ci-resources.sh 30 &
          resources=$!
          trap 'kill "$resources"' EXIT
          ./gradlew check --continue

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: End-to-end tests (emulator, fake data)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run end-to-end tests on a managed device
        run: >
          ./gradlew :app:pixel9api37DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-reports
          path: app/build/outputs/androidTest-results/
          retention-days: 7
